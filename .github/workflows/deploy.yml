name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a running production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Personal contact details for the legal notice / contact section.
    # Stored as repository secrets (Settings → Secrets and variables → Actions),
    # so they never appear in the repository or in the (public) workflow logs.
    env:
      VITE_CONTACT_NAME: ${{ secrets.CONTACT_NAME }}
      VITE_CONTACT_STREET: ${{ secrets.CONTACT_STREET }}
      VITE_CONTACT_CITY: ${{ secrets.CONTACT_CITY }}
      VITE_CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      VITE_CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
      VITE_CONTACT_GITHUB: ${{ secrets.CONTACT_GITHUB }}
      VITE_CONTACT_LINKEDIN: ${{ secrets.CONTACT_LINKEDIN }}
    steps:
      # Refuse to publish a legal notice with "[…]" placeholders.
      - name: Check contact details
        run: |
          missing=""
          for name in STREET CITY EMAIL PHONE; do
            var="VITE_CONTACT_$name"
            [ -n "${!var}" ] || missing="$missing CONTACT_$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # e.g. "/Portfolio" for a project repository, "" for <user>.github.io
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
