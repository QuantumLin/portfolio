<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 120" preserveAspectRatio="none">
  <!--
    Warm text panel of the hero (desktop). The S-curve edge is blurred inside the
    SVG, so the browser rasterizes it once instead of running a CSS blur filter on
    every repaint. Units ≈ % of the section; the shape and the filter region extend
    well beyond the visible area so the outer edges stay fully opaque.
  -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2" />
      <stop offset="1" stop-color="#f4ede1" />
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-80" y="-80" width="260" height="260">
      <feGaussianBlur stdDeviation="4 6" />
    </filter>
  </defs>
  <path filter="url(#soft)" fill="url(#panel)" d="M55 -60L55 -10C54 22 45 35 47 55C49 75 53 86 51 110L51 160H-60V-60Z" />
</svg>
