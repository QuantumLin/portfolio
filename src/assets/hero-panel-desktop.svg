<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 120" preserveAspectRatio="none">
  <!--
    (Note: XML comments must not contain two hyphens in a row, or the whole SVG is invalid.)
    MASK for the hero's text panel (desktop): white = panel visible, transparent = hidden.
    Only the shape lives here; the colours come from the "hero-panel-from/to" colour tokens in
    src/styles/index.css. The S-curve edge is blurred inside the SVG, so the browser
    rasterizes it once instead of running a CSS blur filter on every repaint.
    Units ≈ % of the section; shape and filter region extend beyond the visible area
    so the outer edges stay fully opaque.
  -->
  <defs>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-80" y="-80" width="260" height="260">
      <feGaussianBlur stdDeviation="4 6" />
    </filter>
  </defs>
  <path filter="url(#soft)" fill="#fff" d="M55 -60L55 -10C54 22 45 35 47 55C49 75 53 86 51 110L51 160H-60V-60Z" />
</svg>
